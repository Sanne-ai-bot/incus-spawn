net.ipv4.ip_forward=1
net.ipv6.conf.all.forwarding=1

# Bridged frames skip iptables (#1137). With CONFIG_BRIDGE_NETFILTER the kernel defaults these to
# 1, which runs the gateway's DNAT of :443 to the host's proxy (incus-spawn-vm-init) during the
# bridge's prerouting, before Incus's per-NIC chains: the --proxy-only ACL then sees the host's
# address and port instead of the gateway's 443, and drops every connection to the proxy. The DNAT
# needs none of it: it matches -i incusbr0 on the routed path, where it runs either way.
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-arptables=0

# Every container shares one host UID range (idmap base 0 -> host uid 1000000),
# so all of them draw on the *same* per-UID kernel budgets. The defaults are
# sized for one interactive user, not a dozen systemd instances: at ~10 inotify
# instances per container, the 128 default runs out around the tenth container
# and the next one's PID 1 dies before it logs anything (the veth appears and
# vanishes within 100ms, and exec then fails with "Failed to get init pid").
fs.inotify.max_user_instances=8192
fs.inotify.max_user_watches=524288

# Allow kernel-inclusive profiling from unprivileged containers. The default (2)
# restricts perf_event_open() to userspace-only, which blocks perf record/stat
# with kernel samples and narrows what async-profiler can see. -1 removes all
# restrictions -- the container is the security boundary, not this sysctl.
kernel.perf_event_paranoid=-1
