name: Update base image

# Keeps the built-in base-image tag in common/src/main/resources/images/minimal.yaml
# in step with the newest release of the Sanne/incus-spawn-images repo. That tag is
# the offline fallback used when a build cannot reach the release list; "track latest"
# resolves the newest release at build time, but this keeps the fallback from drifting.
#
# Event-driven (push model): the images repo fires a `base-image-released`
# repository_dispatch when it publishes a release, carrying the tag and checksums
# in the payload — so there is nothing to poll or re-derive. The manual
# `workflow_dispatch` path is a backstop that re-derives the newest release from
# the images repo's release list (used if a dispatch is ever missed).
#
# A release carries two VM images (#1255): the stock-based -vm.tar.xz, listed in
# SHA256SUMS for isx releases before this reader, and the one built from scratch,
# -vm-direct.tar.xz, listed only in SHA256SUMS.v2. When a release has the direct
# one for both arches, the bump points vm_image_url at it; otherwise it keeps the
# stock image. The PR says which.

on:
  repository_dispatch:
    types: [base-image-released]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # Check out with BOT_TOKEN so the branch push and PR are made by that token
      # rather than the default GITHUB_TOKEN — this both avoids needing the org
      # "Actions may create pull requests" setting and lets the resulting PR run CI
      # (PRs opened by GITHUB_TOKEN are deliberately blocked from triggering workflows).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}

      - name: Resolve release + checksums
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          YAML="common/src/main/resources/images/minimal.yaml"
          CURRENT_TAG="$(yq -r '.image_tag' "$YAML")"

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            # The images repo already computed the tag + checksums; trust the payload.
            TAG="$(jq -r '.tag' <<<"$PAYLOAD")"
            C_X86="$(jq -r '.sha256.container.x86_64' <<<"$PAYLOAD")"
            C_ARM="$(jq -r '.sha256.container.aarch64' <<<"$PAYLOAD")"
            V_X86="$(jq -r '.sha256.vm.x86_64' <<<"$PAYLOAD")"
            V_ARM="$(jq -r '.sha256.vm.aarch64' <<<"$PAYLOAD")"
            D_X86="$(jq -r '.sha256.vm_direct.x86_64 // empty' <<<"$PAYLOAD")"
            D_ARM="$(jq -r '.sha256.vm_direct.aarch64 // empty' <<<"$PAYLOAD")"
          else
            # Manual backstop: derive from the images repo's newest release.
            # Single source of truth: derive the owning repo from the image_url.
            IMAGES_REPO="$(yq -r '.image_url' "$YAML" \
              | sed -E 's#https://github.com/([^/]+/[^/]+)/.*#\1#')"
            TAG="$(gh api "repos/$IMAGES_REPO/releases" \
              --jq '[.[] | select(.tag_name | startswith("fedora-"))][0].tag_name')"
            SUMS_URL="$(gh api "repos/$IMAGES_REPO/releases/tags/$TAG" \
              --jq '.assets[] | select(.name == "SHA256SUMS") | .browser_download_url')"
            if [[ -z "$SUMS_URL" ]]; then
              echo "Release $TAG has no SHA256SUMS asset; aborting." >&2
              exit 1
            fi
            curl -fsSL "$SUMS_URL" -o SHA256SUMS
            # <sha>  <filename>, looked up by exact name.
            sha_for() { awk -v f="$1" '$2 == f { print $1 }' "$2"; }
            C_X86="$(sha_for "fedora-44-x86_64.tar.xz" SHA256SUMS)"
            C_ARM="$(sha_for "fedora-44-aarch64.tar.xz" SHA256SUMS)"
            V_X86="$(sha_for "fedora-44-x86_64-vm.tar.xz" SHA256SUMS)"
            V_ARM="$(sha_for "fedora-44-aarch64-vm.tar.xz" SHA256SUMS)"
            D_X86=""
            D_ARM=""
            V2_URL="$(gh api "repos/$IMAGES_REPO/releases/tags/$TAG" \
              --jq '.assets[] | select(.name == "SHA256SUMS.v2") | .browser_download_url')"
            if [[ -n "$V2_URL" ]]; then
              curl -fsSL "$V2_URL" -o SHA256SUMS.v2
              D_X86="$(sha_for "fedora-44-x86_64-vm-direct.tar.xz" SHA256SUMS.v2)"
              D_ARM="$(sha_for "fedora-44-aarch64-vm-direct.tar.xz" SHA256SUMS.v2)"
            fi
            rm -f SHA256SUMS SHA256SUMS.v2
          fi

          # The direct image for both arches, or not at all: one arch's would leave the
          # other with a URL and no checksum.
          VM_KIND=stock
          if [[ "$D_X86" =~ ^[0-9a-f]{64}$ && "$D_ARM" =~ ^[0-9a-f]{64}$ ]]; then
            VM_KIND=direct
            V_X86="$D_X86"
            V_ARM="$D_ARM"
          elif [[ "$(yq -r '.vm_image_url' "$YAML")" == *-vm-direct.tar.xz ]]; then
            # Never back to the stock image unasked: a release missing the direct one is a
            # broken release, not a reason to move every user's VMs.
            echo "Release $TAG lacks -vm-direct for both arches, and the built-in already uses it; aborting." >&2
            exit 1
          fi

          for pair in "tag:$TAG" \
                      "container/x86_64:$C_X86" "container/aarch64:$C_ARM" \
                      "vm/x86_64:$V_X86" "vm/aarch64:$V_ARM"; do
            val="${pair#*:}"
            if [[ -z "$val" || "$val" == "null" ]]; then
              echo "Missing ${pair%%:*} in resolved release; aborting." >&2
              exit 1
            fi
          done

          {
            echo "tag=$TAG"
            echo "current=$CURRENT_TAG"
            echo "c_x86=$C_X86"
            echo "c_arm=$C_ARM"
            echo "v_x86=$V_X86"
            echo "v_arm=$V_ARM"
            echo "vm_kind=$VM_KIND"
          } >> "$GITHUB_OUTPUT"

          echo "Current built-in tag: $CURRENT_TAG"
          echo "Incoming release tag: $TAG"
          # Current means the same tag, VM image and checksums: a stock-image bump of this
          # very release, already merged, still leaves the switch to -vm-direct to make.
          CURRENT_VM_FILE="$(yq -r '.vm_image_url' "$YAML" | sed -E 's#.*/##')"
          WANT_VM_FILE="fedora-44-{arch}-vm.tar.xz"
          [[ "$VM_KIND" == direct ]] && WANT_VM_FILE="fedora-44-{arch}-vm-direct.tar.xz"
          CURRENT_SUMS="$(yq -r '[.image_sha256.x86_64, .image_sha256.aarch64, .vm_image_sha256.x86_64, .vm_image_sha256.aarch64] | join(" ")' "$YAML")"
          # Said in the PR, since the trust root changes with them: the same tag with other
          # checksums is a release published again, and a new VM file is a switch of image.
          # Published again: under the same tag, a file that was there before has another
          # checksum; a VM file the built-in did not use yet is a switch, not that.
          CURRENT_C="$(yq -r '[.image_sha256.x86_64, .image_sha256.aarch64] | join(" ")' "$YAML")"
          CURRENT_V="$(yq -r '[.vm_image_sha256.x86_64, .vm_image_sha256.aarch64] | join(" ")' "$YAML")"
          if [[ "$TAG" == "$CURRENT_TAG" ]] && { [[ "$CURRENT_C" != "$C_X86 $C_ARM" ]] \
                || { [[ "$CURRENT_VM_FILE" == "$WANT_VM_FILE" ]] && [[ "$CURRENT_V" != "$V_X86 $V_ARM" ]]; }; }; then
            echo "republished=true" >> "$GITHUB_OUTPUT"
          fi
          [[ "$CURRENT_VM_FILE" != "$WANT_VM_FILE" ]] && echo "vm_switch=true" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == "$CURRENT_TAG" && "$CURRENT_VM_FILE" == "$WANT_VM_FILE" \
                && "$CURRENT_SUMS" == "$C_X86 $C_ARM $V_X86 $V_ARM" ]]; then
            echo "Already current; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update minimal.yaml
        if: steps.resolve.outputs.changed == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          C_X86: ${{ steps.resolve.outputs.c_x86 }}
          C_ARM: ${{ steps.resolve.outputs.c_arm }}
          V_X86: ${{ steps.resolve.outputs.v_x86 }}
          V_ARM: ${{ steps.resolve.outputs.v_arm }}
          VM_KIND: ${{ steps.resolve.outputs.vm_kind }}
        run: |
          set -euo pipefail
          YAML="common/src/main/resources/images/minimal.yaml"
          VM_FILE="fedora-44-{arch}-vm.tar.xz"
          [[ "$VM_KIND" == direct ]] && VM_FILE="fedora-44-{arch}-vm-direct.tar.xz"
          VM_URL="$(yq -r '.vm_image_url' "$YAML" | sed -E "s#[^/]+\$#$VM_FILE#")"
          yq -i "
            .vm_image_url = \"$VM_URL\" |
            .image_tag = \"$TAG\" |
            .image_sha256.x86_64 = \"$C_X86\" |
            .image_sha256.aarch64 = \"$C_ARM\" |
            .vm_image_sha256.x86_64 = \"$V_X86\" |
            .vm_image_sha256.aarch64 = \"$V_ARM\"
          " "$YAML"
          echo "Updated $YAML to $TAG"
          git diff -- "$YAML"

      - name: Open pull request
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          CURRENT_TAG: ${{ steps.resolve.outputs.current }}
          VM_KIND: ${{ steps.resolve.outputs.vm_kind }}
          REPUBLISHED: ${{ steps.resolve.outputs.republished }}
          VM_SWITCH: ${{ steps.resolve.outputs.vm_switch }}
          C_X86: ${{ steps.resolve.outputs.c_x86 }}
          C_ARM: ${{ steps.resolve.outputs.c_arm }}
          V_X86: ${{ steps.resolve.outputs.v_x86 }}
          V_ARM: ${{ steps.resolve.outputs.v_arm }}
        run: |
          set -euo pipefail
          # A -vm-direct bump has a branch of its own, so a stock-image bump of the same
          # release, opened before this reader existed, does not stand in its way; so has the
          # bump of a release published again under its tag, named by all four new checksums,
          # so a later re-publish that changes any one of them is not taken for this one.
          BRANCH="bot/update-base-image-$TAG"
          [[ "$VM_KIND" == direct ]] && BRANCH="$BRANCH-vm-direct"
          if [[ "$REPUBLISHED" == true ]]; then
            BRANCH="$BRANCH-$(printf '%s %s %s %s' "$C_X86" "$C_ARM" "$V_X86" "$V_ARM" | sha256sum | cut -c1-12)"
          fi

          TITLE="Update base image to $TAG"
          SUMMARY="Bumps the built-in base-image fallback from \`$CURRENT_TAG\` to \`$TAG\` (newest release of Sanne/incus-spawn-images), refreshing the container and VM checksums."
          if [[ "$REPUBLISHED" == true ]]; then
            TITLE="Base image $TAG was published again: new checksums"
            SUMMARY="**Same tag, checksums changed.** Release \`$TAG\` of Sanne/incus-spawn-images was published again under the tag the built-in already names, with different files. Check every checksum against the release before merging: they are what every base-image download is verified against."
          fi
          [[ "$VM_SWITCH" == true && "$VM_KIND" == direct ]] && TITLE="$TITLE, VM image built from scratch"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; a PR is likely already open. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add common/src/main/resources/images/minimal.yaml
          git commit -m "$TITLE"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "$TITLE" \
            --body "$SUMMARY

          VM image: \`$VM_KIND\` (\`direct\` is the image built from scratch, \`-vm-direct.tar.xz\`, listed in SHA256SUMS.v2; \`stock\` is \`-vm.tar.xz\`).

          Builds already track the latest release at build time when unpinned; this keeps the offline fallback current." \
            --base main \
            --head "$BRANCH"
