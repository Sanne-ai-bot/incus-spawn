name: Verify base-image checksums

# The four base-image checksums in minimal.yaml are what makes every base-image download safe, and
# they have been merged wrong more than once. This checks them against the release's own SHA256SUMS
# and SHA256SUMS.v2, for the assets image_url and vm_image_url download, whenever the file changes:
# a bump by update-base-image.yml and one made by hand alike (#1678).

on:
  pull_request:
    branches: [main]
    paths:
      - common/src/main/resources/images/minimal.yaml
      - .github/scripts/base-image-sums.sh
      - .github/scripts/verify-base-image-sums.sh
      - .github/workflows/verify-base-image-checksums.yml
  push:
    branches: [main]
    paths:
      - common/src/main/resources/images/minimal.yaml
      - .github/scripts/base-image-sums.sh
      - .github/scripts/verify-base-image-sums.sh
      - .github/workflows/verify-base-image-checksums.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-base-image-checksums:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check minimal.yaml's checksums against the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-base-image-sums.sh
